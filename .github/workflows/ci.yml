name: Python CI and security regression tests

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    env:
      # A disposable value for CI only; production must provide its own key.
      AUDIT_SECRET_KEY: ci-only-test-key-not-for-production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package and development dependencies
        run: python -m pip install -e ".[api,dev]"
      - name: Compile Python modules
        run: python -m compileall -q agents dicom_metadata_deid_agent cli.py dicom_deid.py enrichment.py
      - name: Check Python syntax and undefined names
        run: ruff check --select E9,F63,F7,F82 .
      - name: Execute regression tests
        run: python -m pytest -q
