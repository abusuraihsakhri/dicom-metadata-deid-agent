[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dicom-metadata-deid-engine"
version = "2.0.0"
description = "DICOM-DeID Sentinel: PS 3.15 Attribute Confidentiality & Metadata Scrubbing Engine"
readme = "README.md"
authors = [{ name = "Dr. Abu Suraih Sakhri", email = "abusuraih@example.com" }]
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.9"
dependencies = [
    "pydantic>=2.0,<3",
    "pydicom>=3.0,<4",
]

[project.optional-dependencies]
api = ["fastapi>=0.110,<1", "uvicorn>=0.30,<1"]
dev = ["pytest>=8,<10", "ruff>=0.6,<1"]

[project.scripts]
dicom-metadata-deid-engine = "dicom_metadata_deid_agent.cli:main"
dicom-metadata-inspect = "dicom_metadata_deid_agent.deidentify:main"

[project.urls]
Homepage = "https://github.com/abusuraihsakhri/dicom-metadata-deid-agent"
Repository = "https://github.com/abusuraihsakhri/dicom-metadata-deid-engine.git"

[tool.setuptools]
packages = ["agents", "dicom_metadata_deid_agent"]
py-modules = [
    "cli", "dicom_deid", "enrichment", "simulator",
    "dicom_deid_app", "dicom_metadata_deid_agent_app",
]
